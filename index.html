<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bid Pricer">
<title>Bid Pricer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--brand:#0e7c66;--brand-d:#0a5547;--brand-l:#e3f2ee;--bg:#f2f5f4;--card:#fff;--ink:#17231f;--mut:#5d6d68;--line:#dbe4e1;--warn:#9a4a00;--warnbg:#fff4e0;--bad:#b42318;--badbg:#fdecea;--ok:#13703a;--okbg:#e6f5ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
header.app{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;overflow:hidden;flex:none;letter-spacing:-.5px}
.logo img{width:100%;height:100%;object-fit:contain}
header .t1{font-weight:700;font-size:17px;line-height:1.15}
header .t2{font-size:12px;opacity:.85}
main{padding:12px 12px 170px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px 10px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:60px}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--line)}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--brand);color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.card h3{font-size:15px;margin:14px 0 8px}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 12px}
label.f{display:block;margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;font-size:17px;padding:11px 12px;border:1px solid #c5d1cd;border-radius:10px;background:#fff;color:var(--ink);min-height:50px;font-family:inherit;font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label.f textarea{min-height:96px}
label.f input[type=range]{padding:0;border:0;min-height:36px;accent-color:var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:16px;min-height:54px;background:#fff}
.chk input{width:26px;height:26px;accent-color:var(--brand);flex:none;margin:0}
.chk small{color:var(--mut);display:block;font-size:12.5px}
.chk .grow{flex:1}
.chk.on{border-color:var(--brand);background:var(--brand-l)}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:5px 0 0}
.seg button{min-width:0;min-height:48px;border:1px solid #c5d1cd;background:#fff;border-radius:10px;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;min-height:50px;background:var(--brand);color:#fff;text-decoration:none}
.btn.sec{background:#e3ecea;color:var(--brand-d)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:42px;padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.addon{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.addon .ttl{font-weight:700;margin-bottom:8px}
.addon .det{display:none;margin-top:10px}
.addon.active .det{display:block}
.addon.active{border-color:var(--brand)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.kv .big{font-size:20px;font-weight:800;color:var(--brand-d)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}
.alert.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d29a}
.alert.bad{background:var(--badbg);color:var(--bad);border:1px solid #f4b8b2}
.alert.ok{background:var(--okbg);color:var(--ok);border:1px solid #acdcbf}
.alert.info{background:#eef4ff;color:#1d4b8f;border:1px solid #c6d8f5}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:#fff}
.tier.rec{border:2px solid var(--brand);background:var(--brand-l)}
.tier .nm{font-weight:800;font-size:14px}
.tier .lb{font-size:11.5px;color:var(--mut)}
.tier .pr{font-size:19px;font-weight:800;margin:4px 0 0;font-variant-numeric:tabular-nums}
.tier .sub{font-size:11.5px;color:var(--mut)}
.sticky{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:25;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 -2px 8px rgba(0,0,0,.15)}
.sticky .p{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.sticky .m{font-size:12.5px;opacity:.9}
.sticky .grow{flex:1}
.sticky .btn{background:#fff;color:var(--brand-d);min-height:46px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.badge.ok{background:#c9f0d8;color:#0b5a2b}.badge.warn{background:#ffe2b0;color:#7a3b00}.badge.bad{background:#ffd0cb;color:#8f1a10}
.sticky .badge.ok{background:#bdf3d1}
.list .item{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.list .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.list .nm{font-weight:700;font-size:17px}
.list .meta{font-size:13px;color:var(--mut)}
.list .pr{font-weight:800;font-size:18px;color:var(--brand-d);white-space:nowrap;text-align:right}
.list .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.list .acts .btn{flex:1 1 0;min-height:46px;font-size:14px;padding:8px 4px;white-space:nowrap;gap:4px}
.list .acts .btn.danger{flex:0 0 50px}
.status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:#eef1f0;color:var(--mut)}
.status.Sent{background:#e6efff;color:#1d4b8f}.status.Won{background:#d9f4e3;color:#0b5a2b}.status.Lost{background:#fde5e2;color:#8f1a10}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
table.ed{width:100%;border-collapse:collapse;font-size:15px}
table.ed td{padding:4px 3px;vertical-align:middle}
table.ed input,table.ed select{width:100%;font-size:16px;padding:9px;border:1px solid #c5d1cd;border-radius:8px;min-height:44px;font-family:inherit}
table.ed th{font-size:12px;color:var(--mut);text-align:left;padding:2px 3px}
.x{border:0;background:var(--badbg);color:var(--bad);border-radius:8px;min-width:40px;min-height:44px;font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:#17231f;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.hidden{display:none!important}
/* proposal */
.prop{background:#fff;border-radius:14px;border:1px solid var(--line);padding:18px;font-size:14.5px;color:#1a1a1a}
.prop .ph{display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:14px}
.prop .ph .logo{width:56px;height:56px;font-size:20px;background:var(--brand);color:#fff;border-radius:12px}
.prop .ph .logo.img{background:#fff}
.prop .co{font-weight:800;font-size:18px;line-height:1.2}
.prop .co2{font-size:12.5px;color:#555}
.prop h1{font-size:21px;margin:0 0 4px;color:var(--brand-d)}
.prop h4{font-size:15px;margin:18px 0 8px;color:var(--brand-d);border-bottom:1px solid #e3e3e3;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.prop .meta2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px}
.prop .meta2 b{display:block;font-size:11.5px;color:#666;text-transform:uppercase;letter-spacing:.4px}
.prop ul.scope{list-style:none;padding:0;margin:0 0 8px}
.prop ul.scope li{padding:3px 0 3px 26px;position:relative}
.prop ul.scope li:before{content:"";position:absolute;left:2px;top:6px;width:13px;height:13px;border:1.5px solid var(--brand);border-radius:3px}
.prop ul.scope li:after{content:"";position:absolute;left:6px;top:8px;width:4px;height:7px;border:solid var(--brand);border-width:0 2px 2px 0;transform:rotate(45deg)}
.prop .freq{font-weight:700;margin:10px 0 2px;font-size:14px}
.prop .ptiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prop .pt{border:1px solid #d7d7d7;border-radius:10px;padding:10px;text-align:center}
.prop .pt.rec{border:2px solid var(--brand);background:var(--brand-l)}
.prop .pt .nm{font-weight:800}
.prop .pt .pr{font-size:20px;font-weight:800;margin:4px 0}
.prop .pt .d{font-size:12px;color:#444;text-align:left;margin-top:6px}
.prop .pt .tag{font-size:10.5px;font-weight:800;color:var(--brand-d);text-transform:uppercase;letter-spacing:.5px}
.prop table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.prop table.t th,.prop table.t td{border-bottom:1px solid #e3e3e3;padding:6px 4px;text-align:left}
.prop table.t td.r,.prop table.t th.r{text-align:right}
.prop ol.terms{padding-left:20px;margin:0}
.prop ol.terms li{margin-bottom:4px}
.prop .sig{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}
.prop .sig .ln{border-bottom:1px solid #333;height:34px}
.prop .sig .lb{font-size:12px;color:#555;margin-top:3px}
.prop .choose{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px}
.prop .choose span:before{content:"☐ ";font-size:16px}
.prop .foot{font-size:11.5px;color:#666;text-align:center;margin-top:16px;border-top:1px solid #e3e3e3;padding-top:8px}
@media (max-width:420px){.prop .ptiers{grid-template-columns:1fr}.prop .meta2{grid-template-columns:1fr}.prop .sig{grid-template-columns:1fr}}
@media print{
  @page{size:letter;margin:.5in}
  html,body{background:#fff}
  header.app,nav.tabs,.sticky,.noprint,#toast{display:none!important}
  main{padding:0;max-width:none}
  .prop{border:0;padding:0;border-radius:0;font-size:12.5px}
  .prop .ptiers{grid-template-columns:repeat(3,1fr)}
  .prop .meta2{grid-template-columns:1fr 1fr}
  .prop .sig{grid-template-columns:1fr 1fr}
  .prop h4{break-after:avoid}
  .prop .pt,.prop .sigwrap,.prop table.t tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ===== v2: header language button, 5 tabs ===== */
header.app .hgrow{flex:1;min-width:0}
header.app .t1,header.app .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#langBtn{flex:none;border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;font-weight:800;font-size:13px;padding:7px 11px;min-height:38px;letter-spacing:.5px}
#langBtn:active{background:rgba(255,255,255,.3)}
nav.tabs button{font-size:11.5px;padding:8px 2px 10px}
/* ===== Today ===== */
.hello{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:0}
.hello .hdate{font-size:20px;font-weight:800;margin-bottom:10px}
.hello .hdate::first-letter{text-transform:uppercase}
.hello .hint{color:rgba(255,255,255,.9);margin:10px 0 0}
.qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qbtns .btn{min-width:0;padding:8px 4px;font-size:14px;min-height:48px}
.hello .qbtns .btn{background:#fff;color:var(--brand-d);border-color:#fff}
.hello .qbtns .btn.sec{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.6)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--brand-l);color:var(--brand-d);font-size:13px;font-weight:800;margin-left:auto}
.cnt.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink);min-height:40px}
.chip b{font-size:15px;margin-right:2px}
.walkwhen{font-size:13.5px;color:var(--brand-d);font-weight:700;margin-top:2px}
/* ===== Lead rows ===== */
.list2{padding:4px 14px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lmain{flex:1;min-width:0;cursor:pointer}
.lmain .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain .meta{font-size:13px;color:var(--mut);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.callbtn{flex:none;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:21px}
.pri{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:#eef2f1;color:var(--mut);font-size:11.5px;font-weight:800;vertical-align:2px}
.lstatus{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef2f1;color:#41504b;white-space:nowrap}
.s-new{background:#e8f0fe;color:#1a4fb4}.s-called{background:#eef2f1;color:#41504b}.s-vm{background:#f3ecfb;color:#6b3fa0}
.s-interested{background:#fff4e0;color:#9a4a00}.s-walk{background:#e0f4fb;color:#0b6585}.s-bidsent{background:#fdf2d6;color:#7a5600}
.s-won{background:var(--okbg);color:var(--ok)}.s-lost{background:#f1f1f1;color:#6b6b6b}.s-dnc{background:var(--badbg);color:var(--bad)}
.chip.s-new,.chip.s-called,.chip.s-vm,.chip.s-interested,.chip.s-walk,.chip.s-bidsent,.chip.s-won,.chip.s-lost,.chip.s-dnc{border-color:transparent}
.due{font-size:12.5px;color:var(--mut);white-space:nowrap}
.due.od{color:var(--bad);font-weight:700}.due.td{color:var(--warn);font-weight:700}
.filters .row{margin-top:0}
.filters label.f{margin-bottom:8px}
.linked{font-size:13px}
/* ===== Lead detail ===== */
.lhead .lt{font-size:21px;font-weight:800;line-height:1.2}
.lhead .meta{color:var(--mut);font-size:14px;margin-top:3px}
.abtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 12px}
.abtns .btn{flex-direction:column;gap:2px;font-size:12.5px;min-height:62px;padding:6px 2px;min-width:0;line-height:1.15;text-align:center}
.abtns .btn .ic{font-size:21px}
.abtns .btn[disabled],.abtns a.btn.off{opacity:.35;pointer-events:none}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.qgrid .btn{min-width:0;font-size:14.5px;min-height:48px;padding:6px 8px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 12px}
.seg4 .btn{min-width:0;padding:6px 2px;font-size:13.5px}
ul.acts{list-style:none;margin:0;padding:0}
ul.acts li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
ul.acts li:last-child{border-bottom:0}
ul.acts li .when{display:block;font-size:12px;color:var(--mut)}
.linkbar{cursor:pointer}
/* ===== Finder & templates ===== */
.linkgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.linkgrid .lk{min-width:0;font-size:13.5px;min-height:50px;padding:6px 8px;text-align:center;line-height:1.2;text-decoration:none}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:#fbfdfc}
.tpl .tname{font-weight:800;font-size:15px;margin-bottom:6px;color:var(--brand-d)}
.tsub{font-size:14px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.tbody{white-space:pre-wrap;font-size:15px;line-height:1.5;margin:0 0 10px}
details.obj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:#fbfdfc}
details.obj summary{font-weight:700;cursor:pointer;font-size:15px}
details.obj[open] summary{margin-bottom:8px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-spacing:4px;line-height:1.8}
.langpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:600}
.seg2{display:inline-grid;grid-template-columns:repeat(2,1fr);border:1px solid #c5d1cd;border-radius:10px;overflow:hidden;background:#fff}
.seg2 button{border:0;background:none;padding:9px 16px;font-size:15px;color:var(--ink);min-height:44px}
.seg2 button.on{background:var(--brand);color:#fff;font-weight:700}
/* ===== Settings ===== */
.ftrow{margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.ftrow:last-of-type{border-bottom:0}
.ftrow input,.ftrow select{width:100%;font-size:16px;padding:9px 10px;border:1px solid #c5d1cd;border-radius:9px;min-height:44px;background:#fff;color:var(--ink);font-family:inherit}
.g3{display:grid;grid-template-columns:1fr 90px 44px;gap:6px;margin-bottom:6px}
.g3b{display:grid;grid-template-columns:1fr 70px 110px;gap:6px;margin-bottom:6px}
input.es{font-style:italic;background:#fafcfb}
.starter{border:1.5px dashed var(--brand);background:var(--brand-l);border-radius:12px;padding:12px;margin:4px 0 0}
.starter .hint{margin:4px 0 10px}
@media (max-width:360px){.abtns .btn{font-size:11.5px}.qbtns .btn{font-size:13px}}
@media print{.langpick{display:none!important}}

</style>
</head>
<body>
<header class="app">
  <div class="logo" id="hLogo"></div>
  <div class="hgrow"><div class="t1" id="hName"></div><div class="t2" id="hSub"></div></div>
  <button type="button" id="langBtn"></button>
</header>
<main>
  <section id="v-today"></section>
  <section id="v-leads" class="hidden"></section>
  <section id="v-lead" class="hidden"></section>
  <section id="v-finder" class="hidden"></section>
  <section id="v-import" class="hidden"></section>
  <section id="v-bids" class="hidden"></section>
  <section id="v-bid" class="hidden"></section>
  <section id="v-proposal" class="hidden"></section>
  <section id="v-scripts" class="hidden"></section>
  <section id="v-settings" class="hidden"></section>
</main>
<div class="sticky hidden" id="sticky">
  <div class="grow"><div class="p" id="stP"></div><div class="m" id="stM"></div></div>
  <button class="btn" id="stProp"></button>
</div>
<nav class="tabs" id="navTabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<input type="file" id="logoFile" accept="image/*" class="hidden">
<input type="file" id="csvFile" class="hidden">
<script>
window.__PWA=true;
(function(){

var PHONE_SCRIPTS=[
  {id:'gatekeeper',
   en:'"Hi, this is {owner} with {company}. We\'re a local cleaning company here in {city}. Quick question: who takes care of your cleaning, the office manager or the owner? … Great, what\'s their name? … Is {contact} around for a minute?"\n\nIf they\'re not available: "No problem. When\'s a good time to catch them? And what\'s the best email for them?"\n\nIf you already emailed: "I sent {contact} a short email this week about cleaning, and I\'m just following up on it."',
   es:'"Buenos días, le habla {owner}, de {company}. Somos una empresa de limpieza local aquí en {city}. Una pregunta rápida: ¿quién se encarga de la limpieza de sus instalaciones, el gerente de la oficina o el dueño? … Perfecto, ¿cómo se llama? … ¿Estará {contact} disponible un minuto?"\n\nSi no está disponible: "No se preocupe. ¿A qué hora me conviene llamarle? ¿Y cuál es su mejor correo electrónico?"\n\nSi ya le envió un correo: "Esta semana le envié a {contact} un breve correo sobre servicios de limpieza y solo quería darle seguimiento."'},
  {id:'decision',
   en:'"Hi {first}, this is {owner}. I own {company}, a local commercial cleaning company serving {city} and the surrounding area. I\'ll be quick. We do {services} for {segment} like yours. I\'m not calling to sell you anything over the phone. I just wanted to see if you\'d be open to a free walkthrough so I can give you a no-pressure quote."\n\nHook: "{hook}"',
   es:'"Hola, {first}, le habla {owner}. Soy dueño de {company}, una empresa local de limpieza comercial que atiende {city} y sus alrededores. Seré breve. Ofrecemos {services} para {segment} como el suyo. No le llamo para venderle nada por teléfono; solo quería saber si le interesaría un recorrido gratuito para darle una cotización sin compromiso."\n\nGancho: "{hook}"'},
  {id:'ask',
   en:'"I do walkthroughs on {walkdays}. It takes about 20 minutes and there\'s no obligation. Would {walkdate} work, or is {walkdate2} better? Morning or afternoon?"\n\nThen confirm: "Perfect. I have you down for {walkday} [date] at [time] at [address]. What\'s the best email for a confirmation? And who should I ask for when I get there?"\n\nIf they\'re open to it: "About how big is the space?" · "How often are you cleaned now, and is there anything you wish was done better?"',
   es:'"Hago los recorridos los {walkdays}. Toma unos 20 minutos y no hay ningún compromiso. ¿Le queda bien el {walkdate} o prefiere el {walkdate2}? ¿Por la mañana o por la tarde?"\n\nLuego confirme: "Perfecto. Lo tengo anotado para el {walkday} [fecha] a las [hora] en [dirección]. ¿A qué correo le envío la confirmación? ¿Y por quién pregunto cuando llegue?"\n\nSi tiene disposición: "¿Más o menos de qué tamaño es el espacio?" · "¿Con qué frecuencia limpian ahora y hay algo que le gustaría que se hiciera mejor?"'},
  {id:'voicemail',
   en:'"Hi {first}, this is {owner} with {company}, a local commercial cleaning company. I\'d love to set up a free walkthrough and quote for your space. Please call me at {phoneSpoken}. That\'s {phone}. Thanks!"\n\nAbout 15 seconds. Say the number slowly. Leave at most 2 voicemails, a few days apart, and send the follow-up email the same day.',
   es:'"Hola, {first}, le habla {owner}, de {company}, una empresa local de limpieza comercial. Me gustaría programar un recorrido gratuito y darle una cotización para sus instalaciones. Por favor llámeme al {phoneSpoken}. Repito: {phone}. ¡Muchas gracias!"\n\nUnos 15 segundos. Diga el número despacio. Deje como máximo 2 mensajes, con unos días de diferencia, y envíe el correo de seguimiento el mismo día.'}
];
var OBJECTIONS=[
  {en:['"We already have a cleaner."','"That\'s great, most businesses do. A lot of my clients had someone too and just wanted a second opinion on price or quality. Is there anything you\'d change about your current service? A free walkthrough gives you a comparison quote to keep on file, with no pressure to switch."'],
   es:['"Ya tenemos a alguien que limpia."','"¡Qué bien! La mayoría de los negocios ya tiene a alguien. Muchos de mis clientes también tenían un servicio y solo querían una segunda opinión sobre el precio o la calidad. ¿Hay algo que le gustaría mejorar de su servicio actual? Con un recorrido gratuito usted tendría una cotización para comparar, sin ninguna presión para cambiar."']},
  {en:['"Just send me some info."','"Happy to. What\'s the best email? … Most people find it easier to compare once they see real numbers for their space, and I can only price it after a quick look. Could I pencil in 20 minutes on {walkdate}, and you can cancel if the info doesn\'t fit?"'],

function parseCSV(text){text=String(text||'').replace(/^\uFEFF/,'');var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<text.length;i++){c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
var GUESS={business:['business','businessname','company','companyname','name','organization','account','empresa','negocio'],contact:['contact','contactname','contactperson','person','fullname','nombre','contacto'],title:['title','contacttitle','jobtitle','role','position','cargo','puesto'],
  phone:['phone','phonenumber','telephone','tel','mobile','cell','telefono'],email:['email','emailaddress','mail','correo'],website:['website','web','url','site','sitioweb'],address:['address','streetaddress','street','direccion'],
  city:['city','town','ciudad'],category:['category','industry','businesstype','segment','categoria'],source:['source','leadsource','origen','fuente'],status:['status','stage','estado'],priority:['priority','prioridad'],
  nextFollowUp:['nextfollowup','followup','followupdate','callback','callbackdate','seguimiento'],bestTime:['besttime','besttimetocall','hours','horario'],notes:['notes','note','comments','comment','notas']};
function guessMap(headers){var used={},map={};LEAD_FIELDS.forEach(function(f){var i=headers.findIndex(function(h,j){return !used[j]&&GUESS[f].indexOf(norm(h))>=0});if(i>=0){map[f]=i;used[i]=1}else map[f]=-1});
  if(map.business<0){var j=headers.findIndex(function(h,k){return !used[k]&&/business|company|empresa/i.test(h)});if(j>=0){map.business=j;used[j]=1}}return map}
var imp={rows:null,headers:[],map:{},fileName:'',result:null};
function statusFromText(s){s=norm(s);if(!s)return'new';for(var i=0;i<LSTATUS.length;i++){var k=LSTATUS[i];if(s===k||LANG_CODES.some(function(lc){return norm(tl(lc,'ls.'+k))===s}))return k}return'new'}
function importRows(rows,headers,map,sourceName){
  var res={added:0,dup:0,dnc:0,skipped:0};var col=function(r,f){var i=map[f];return i>=0&&r[i]!=null?String(r[i]).trim():''};
  rows.forEach(function(r){var name=col(r,'business');if(!name){res.skipped++;return}
    var phone=col(r,'phone'),city=col(r,'city');
    var dup=LEADS.some(function(l){return norm(l.business)===norm(name)&&((phone&&norm(l.phone)===norm(phone))||norm(cityName(l.city))===norm(cityName(city))||(!phone&&!city))});if(dup){res.dup++;return}
    var fu=col(r,'nextFollowUp');var fd=/^\d{4}-\d{2}-\d{2}/.test(fu)?fu.slice(0,10):(fu&&!isNaN(Date.parse(fu))?isoDate(new Date(Date.parse(fu))):'');
    var l=newLead({business:name,contact:col(r,'contact'),title:col(r,'title'),phone:phone,email:col(r,'email'),website:col(r,'website'),address:col(r,'address'),city:city,category:col(r,'category'),
      source:col(r,'source')||'import',status:statusFromText(col(r,'status')),priority:(col(r,'priority').match(/\b([ABC])\b/)||[])[1]||'',nextFollowUp:fd,bestTime:col(r,'bestTime'),notes:col(r,'notes')});
    logAct(l,'imported',sourceName||'');if(enforceDnc(l))res.dnc++;LEADS.push(l);res.added++});
  saveLeads();return res;
}

function loadStarter(){
  var res={added:0,dup:0,dnc:0};if(typeof STARTER==='undefined')return res;
  STARTER.leads.forEach(function(r){if(isDnc(r.b)){res.dnc++;return}
    if(LEADS.some(function(l){return norm(l.business)===norm(r.b)})){res.dup++;return}
    var l=newLead({business:r.b,city:r.c?r.c+', NC':'',category:r.cat,phone:r.ph,website:r.w,contact:r.n,title:r.ti,bestTime:r.bt,notes:r.no,sourceUrl:r.u,source:'calllist',priority:r.p,nextFollowUp:r.p==='A'?today():''});
    if(r.t==='follow-up')l.activity.push({ts:'2026-10-07T16:00:00.000Z',type:'emailed',note:'Oct 6–7'});
    logAct(l,'imported',STARTER.name);LEADS.push(l);res.added++});
  saveLeads();return res;
}

function buildScope(b,lang){

  var each=[],weekly=[],monthly=[],T2=b.tasks||{},hard=num(b.hardPct,50),rr=num(b.restrooms);

  if(rr>0){each.push(P('sc.restrooms',{n:P(rr===1?'p.restroom1':'p.restroomN',{n:rr})}));each.push(P('sc.refill'))}
  if(T2.kitchen)each.push(P('sc.kitchen')+(num(b.breakrooms)>1?' '+P('sc.kitchenN',{n:num(b.breakrooms)}):''));

  [1,2].forEach(function(i){var k='sc.f.'+b.facilityType+i;if(T[k])each.push(P(k))});
  weekly.push(P('sc.w.dust'));weekly.push(P('sc.w.spot'));if(T2.kitchen)weekly.push(P('sc.w.micro'));if(hard>0)weekly.push(P('sc.w.edges'));

}

    '<p class="hint">'+esc(t('set.prodCols'))+'</p><button class="btn sec sm" data-sact="addFt">➕ '+esc(t('set.addFt'))+'</button>'+

    '<div class="row">'+sInp(t('set.floorMin'),'extraFloorMin','number')+sInp(t('set.hardAdj'),'hardFloorAdjPct','number')+'</div>'+sInp(t('set.dayAdj'),'daytimeAdjPct','number')+

var vs=$('v-settings');
function onSettingsInput(e){var el=e.target;if(el.id==='uiLangSel'){if(e.type==='change')setLang(el.value);return}
  var path=el.dataset&&el.dataset.s;if(!path)return;var v=el.value;
  if(el.dataset.lines)v=v.split('\n').map(function(x){return x.replace(/\s+$/,'')}).filter(function(x){return x!==''});
  else if(el.type==='number')v=el.value===''?'':num(el.value);else if(el.dataset.num)v=num(el.value);
  setPath(S,path,v);saveSettings();
  if(path==='dncList'&&e.type==='change'){var n=sweepDnc();if(n)toast(t('toast.dncSwept',{n:n}))}
  if(path==='wage'||path==='burdenPct'){var l=$('loadedLbl');if(l)l.textContent=money(num(S.wage)*(1+num(S.burdenPct)/100),true)+t('common.perHr')}
  if(path==='company.dba'||path==='company.logoText')renderShell();}
vs.addEventListener('input',onSettingsInput);vs.addEventListener('change',onSettingsInput);
vs.addEventListener('click',function(e){var a=e.target.closest('[data-sact]');if(!a)return;var act=a.dataset.sact;
  if(act==='addFt'){S.facilityTypes.push({id:'ft'+uid(),name:t('set.newFt'),nameEs:'',rate:3000});saveSettings();renderSettings()}
  else if(act==='delFt'){if(S.facilityTypes.length<=1)return toast(t('toast.keepOne'));if(confirm(t('confirm.delFt',{name:S.facilityTypes[+a.dataset.i].name}))){S.facilityTypes.splice(+a.dataset.i,1);saveSettings();renderSettings()}}
  else if(act==='logo')$('logoFile').click();
  else if(act==='nologo'){S.company.logoImage='';saveSettings();renderSettings()}
  else if(act==='reset'){if(confirm(t('confirm.reset'))){var keep=S.lang;S=migrateSettings({});S.lang=keep;saveSettings();renderSettings();toast(t('toast.reset'))}}
  else if(act==='exportJson')exportJson();
  else if(act==='importJson')$('importFile').click();
  else if(act==='starter'){var r=loadStarter();toast(t('toast.starter',r))}
});
$('logoFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var img=new Image(),rd=new FileReader();
  rd.onload=function(){img.onload=function(){var max=256,sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S.company.logoImage=cv.toDataURL('image/png');saveSettings();renderSettings();toast(t('toast.logo'))};img.src=rd.result};rd.readAsDataURL(f);e.target.value=''});

/* ===================== Export / import ===================== */
function exportJson(){download('bid-pricer-backup-'+today()+'.json',JSON.stringify({app:'cleaning-bid-pricer',version:APP_VERSION,exported:nowIso(),settings:S,bids:BIDS,leads:LEADS},null,2),'application/json');toast(t('toast.backup'))}
function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
function bidsToCsv(){
  var head=['Proposal #','Date','Status','Client','Contact','Phone','Email','Address','Facility type','Sq ft','Restrooms','Floors','Hard floor %','Visits/week','Time of service','Hours/visit','Hours/month','Monthly price','Per visit','Per sq ft','Labor cost/mo','Supplies/mo','Overhead/mo','Gross margin %','Profit/mo','Profit %','Good','Better','Best','Add-ons one-time','Add-ons monthly equiv','Proposal language','Lead','Notes'];
  var rows=BIDS.map(function(b){var r=bidCalc(b),m=r.main,x=r.tiers,l=b.leadId&&getLead(b.leadId);return [b.number,b.date,b.status,b.client,b.contact,b.phone,b.email,b.address,r.facility.name,num(b.sqft),num(b.restrooms),num(b.floors),num(b.hardPct),num(b.visitsPerWeek),tl('en','time.'+b.timeOfService),m.visitHrs.toFixed(2),m.monthHrs.toFixed(2),m.price.toFixed(2),m.perVisit.toFixed(2),m.perSqft.toFixed(4),m.labor.toFixed(2),m.supplies.toFixed(2),m.overhead.toFixed(2),(m.grossPct*100).toFixed(1),m.net.toFixed(2),(m.netPct*100).toFixed(1),x[0]?x[0].price.toFixed(2):'',x[1]?x[1].price.toFixed(2):'',x[2]?x[2].price.toFixed(2):'',r.addonOneTime.toFixed(2),r.addonMonthly.toFixed(2),b.clientLang||'en',l?l.business:'',b.notes]});
  return toCsv([head].concat(rows));
}
function leadsToCsv(){
  var head=['business','contact','title','phone','email','website','address','city','category','source','status','priority','next_follow_up','walkthrough','best_time','client_language','last_activity','activity_count','linked_bid_monthly','notes'];
  var rows=LEADS.map(function(l){var la=(l.activity||[])[(l.activity||[]).length-1];var b=bidsForLead(l)[0];return [l.business,l.contact,l.title,l.phone,l.email,l.website,l.address,l.city,l.category,SOURCES.indexOf(l.source)>=0?tl('en','src.'+l.source):l.source,tl('en','ls.'+l.status),l.priority,l.nextFollowUp,l.walkthrough,l.bestTime,l.clientLang,la?la.ts.slice(0,10)+' '+tl('en','act.'+la.type)+(la.note?' – '+la.note:''):'',(l.activity||[]).length,b?recPrice(b).toFixed(2):'',l.notes]});
  return toCsv([head].concat(rows));
}
function exportCsv(){if(!BIDS.length)return toast(t('toast.noBids'));download('bids-'+today()+'.csv',bidsToCsv(),'text/csv');toast(t('toast.csv'))}
function exportLeadsCsv(){if(!LEADS.length)return toast(t('toast.noLeads'));download('leads-'+today()+'.csv',leadsToCsv(),'text/csv');toast(t('toast.csv'))}
$('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d||!Array.isArray(d.bids))throw 0;
  var add=0,rep=0;function mergeIn(list,arr,mig){arr.forEach(function(nb){if(!nb||!nb.id)return;nb=mig(nb);var i=list.findIndex(function(x){return x.id===nb.id});if(i>=0){list[i]=nb;rep++}else{list.push(nb);add++}})}
  mergeIn(BIDS,d.bids,migrateBid);if(Array.isArray(d.leads))mergeIn(LEADS,d.leads,migrateLead);saveBids();saveLeads();
  if(d.settings&&confirm(t('confirm.restoreSettings'))){S=migrateSettings(d.settings);saveSettings()}
  sweepDnc();toast(t('toast.restored',{a:add,r:rep}));render(view);renderShell()}catch(err){alert(t('toast.badBackup'))}};rd.readAsText(f);e.target.value=''});

  parseCSV:parseCSV,guessMap:guessMap,importRows:importRows,loadStarter:loadStarter,templateVars:templateVars,fillTemplate:fillTemplate,nextWalkDate:nextWalkDate,makeIcs:makeIcs,isDnc:isDnc,guessType:guessType,

render('today');show('today');
if(window.__PWA&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
